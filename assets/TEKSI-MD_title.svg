<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="TEKSI-MD">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081527"/>
      <stop offset="100%" stop-color="#030710"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e3a5f" stroke-width="0.7" opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="896" height="226" rx="18" fill="url(#panel)" stroke="#1e4d8f" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="226" rx="18" fill="url(#grid)"/>

  <path d="M 22 62 L 22 26 L 60 26" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <path d="M 878 62 L 878 26 L 840 26" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <path d="M 22 168 L 22 204 L 60 204" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 878 168 L 878 204 L 840 204" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>

  <rect x="120" y="184" width="660" height="2" rx="1" fill="url(#sweep)"/>

  <text x="450" y="112" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="url(#title)" filter="url(#glow)">TEKSI-MD</text>
  <text x="450" y="158" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="7" fill="#7dd3fc">WHATSAPP MULTI-DEVICE BOT</text>
</svg>
